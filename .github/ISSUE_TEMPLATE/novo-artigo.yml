name: Pedir um artigo novo
description: O Claude escreve o artigo no padrão da Nescon e deixa como rascunho para revisão.
title: "Artigo: "
labels: ["artigo"]
body:
  - type: markdown
    attributes:
      value: |
        Preencha o tema e envie. Em alguns minutos o Claude responde aqui com o link do rascunho.
        Para pedir mudanças depois, comente nesta página começando com **Ajuste:** (ex.: "Ajuste: deixe a resposta rápida mais curta").
  - type: input
    id: tema
    attributes:
      label: Tema do artigo
      description: A dúvida do cliente, como ele perguntaria.
      placeholder: Quanto o sócio deve retirar de pró-labore?
    validations:
      required: true
  - type: textarea
    id: orientacoes
    attributes:
      label: Orientações (opcional)
      description: O que não pode faltar, público, exemplos, serviço para indicar no fim.
      placeholder: Falar do Fator R e dar um exemplo com números redondos.
